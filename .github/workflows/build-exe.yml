name: Build Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv venv
          uv pip install -r requirements.txt
          uv pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          & .\.venv\Scripts\pyinstaller.exe --onefile --windowed --name AIWriteX --clean main.py `
            --add-data "src;src" `
            --add-data "knowledge;knowledge" `
            --add-data "*.jpg;." `
            --add-data "*.png;." `
            --hidden-import=crewai `
            --hidden-import=langchain `
            --hidden-import=langchain_community `
            --hidden-import=langchain_openai `
            --collect-all crewai

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AIWriteX-EXE
          path: dist/AIWriteX.exe
